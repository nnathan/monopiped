[package]
name = "mini-monocypher"
version = "0.3.1"
authors = ["Naveen Nathan <naveen@lastninja.net>"]
description = "C-like Monocypher API with Rust safety where it makes sense"
documentation = "https://docs.rs/mini-monocypher"
homepage = "https://github.com/nnathan/monopiped/tree/main/mini-monocypher"
repository = "https://github.com/nnathan/monopiped/tree/main/mini-monocypher"
keywords = ["monocypher", "cryptography", "x25519", "blake2b", "xchacha20poly1305"]
categories = ["api-bindings", "cryptography"]
license = "CC0-1.0"
edition = "2021"
exclude = ["tests/upstream.rs", "tests/upstream/"]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
mini-monocypher-sys = { version = "0.1.4", path = "./mini-monocypher-sys" }

[dev-dependencies]
rand_core = { version = "0.6.4", features = ["getrandom"] }
hex-literal = "0.4.1"
